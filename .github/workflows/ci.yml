name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build / test / fmt / clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain policy:
      # - Building Sparagmos itself uses `stable` for now.
      # - The project's MIR reference / coverage denominator is Rust
      #   1.100.0 (released 2026-11-12; installed and verified on the
      #   dev host via rustup, including `rustc --emit=mir`).
      # - sparagmos-harness runs its native oracle through
      #   `rustup run 1.100.0 rustc`, so the 1.100.0 toolchain must be
      #   installed in this job too, or the harness tests fail with
      #   "toolchain '1.100.0-...' is not installed". Only the plain
      #   toolchain is needed here (no rustc-dev): the tests compile
      #   and run corpus programs natively and emit MIR.
      # - The driver job below installs 1.100.0 with rustc-dev and
      #   builds the Stable MIR driver with it.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Rust 1.100.0 (reference toolchain for harness tests)
        run: rustup toolchain install 1.100.0 --profile minimal

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      # Formatting is advisory for now: the tree is not yet fmt-clean
      # (e.g. crates/sparagmos-harness/src/dump_parse.rs at dfce498),
      # and reformatting belongs to the lanes that own those files.
      # This step therefore does NOT fail the build (continue-on-error).
      # Drop continue-on-error once the tree is `cargo fmt`-clean.
      - name: Check formatting (advisory, does not fail the build yet)
        continue-on-error: true
        run: cargo fmt --all -- --check

      # Clippy is advisory for now: the codebase is in early scaffold stage
      # and we do not want style lints to block parallel lane work.
      # This step therefore does NOT fail the build (continue-on-error).
      # TODO(lane/issues-ci): drop continue-on-error once all lanes have
      # landed their first implementations and the tree is lint-clean.
      - name: Clippy (advisory, does not fail the build yet)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Coverage marker report
        run: |
          chmod +x scripts/coverage-report.sh
          ./scripts/coverage-report.sh | tee coverage-report.md
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

  driver-corpus:
    name: driver / corpus (Rust 1.100.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The driver is its own workspace and must be built with the
      # pinned Rust 1.100.0 toolchain plus the rustc-dev component
      # (it links librustc_driver via Stable MIR / rustc_public) and
      # RUSTC_BOOTSTRAP=1 (it uses rustc_private features on a release
      # toolchain). Its build.rs bakes an rpath to the build sysroot,
      # so the resulting binary finds librustc_driver at run time.
      - name: Install Rust 1.100.0 with rustc-dev
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustc-dev

      - name: Cache cargo registry and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/sparagmos-driver -> target

      - name: Build driver (1.100.0, RUSTC_BOOTSTRAP=1)
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo build --manifest-path crates/sparagmos-driver/Cargo.toml

      - name: Test driver
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo test --manifest-path crates/sparagmos-driver/Cargo.toml

      - name: Build CLI
        run: cargo build -p sparagmos-cli

      # The corpus command exits non-zero when a case *fails* or hits
      # a native error. The summary step below additionally gates on
      # passed == total, so a case slipping back to UNSUPPORTED also
      # turns this job red (the corpus is 15/15 at the time this job
      # was added; see docs/COVERAGE.md, metric 2(a)).
      # The harness's native oracle uses `rustup run 1.100.0 rustc`,
      # which resolves to the toolchain installed above.
      - name: Corpus measurement (interp path)
        run: |
          set -o pipefail
          ./target/debug/sparagmos corpus 2>&1 | tee corpus-output.txt

      - name: Corpus summary
        if: always()
        run: |
          {
            echo "## Corpus measurement (interp path)"
            echo ""
            echo '```'
            cat corpus-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          line="$(grep -E '^total=' corpus-output.txt | tail -1)"
          if [ -z "$line" ]; then
            echo "::error::corpus summary line (total=...) not found in output"
            exit 1
          fi
          total="$(echo "$line" | sed -n 's/.*total=\([0-9][0-9]*\).*/\1/p')"
          passed="$(echo "$line" | sed -n 's/.*passed=\([0-9][0-9]*\).*/\1/p')"
          rate="$(echo "$line" | sed -n 's/.*pass_rate=\([0-9.]*%\).*/\1/p')"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**total=$total passed=$passed pass_rate=$rate**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$passed" != "$total" ]; then
            echo "::error::corpus regression: passed ($passed) != total ($total)"
            exit 1
          fi
