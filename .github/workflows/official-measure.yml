name: Official Measurement

# The official full-subset measurement (the "both" series): the whole
# 24,937-record denominator of metric 2(b), metric 3 derived over the
# subset's stage-1 candidates with scripts/std-coverage.py, and metric
# 4 measured with the runner's --jit mode. This replaces the manual
# run on the dev host; nothing about the official measurement is run
# by hand.
#
# The metric-2(b) pass runs all four runner stages (--stages all):
# stage 3 attempts the procedure records (the run-make recipes)
# through the runner's procedure harness, and stage 4 attempts the
# rustdoc-check records through the runner's rustdoc harness. The
# metric-4 (--jit) pass attempts neither; they stay in its
# denominator as not attempted, exactly as before.
#
# The survey is split into shards (scripts/ci-subset-tools.py shard,
# round-robin over path order) and each shard runs as one matrix job,
# so the wall time is that of the slowest shard. The two passes have
# separate shard counts: the metric-2(b) pass carries the stage-3 and
# stage-4 records and is several times heavier than the JIT pass, so
# it is cut finer. The jobs are laid out for wall time:
#
#   prepare (survey) ──┬─> measure     (x SHARDS)     ──┐
#   build (driver)  ───┼─> measure-jit (x JIT_SHARDS) ──┼─> aggregate
#   build-host       ──┴─> measure-host (host classes) ─┘
#                      └─> metric3     (std coverage) ──┘
#
# - the driver is built once per host class (the build job for
#   Linux x86_64, the build-host jobs for the other classes), with
#   the `measure` profile (the dev profile's debug assertions and
#   overflow checks, optimizer on;
#   crates/sparagmos-driver/Cargo.toml) and handed to that class's
#   jobs as an artifact, so no shard compiles it and every shard of
#   a class runs the same binary;
# - the metric-2(b) pass is partitioned by host class
#   (ci-subset-tools.py partition; docs/CI.md): the Linux x86_64
#   class keeps the sharded measure jobs, and the other classes
#   (linux-aarch64, darwin-aarch64, darwin-x86_64, windows-msvc,
#   windows-gnu)
#   are judged by the measure-host jobs on their native runners,
#   so records conditioned on those hosts are attempted instead
#   of recorded out of environment. (The windows-gnu class's
#   host model is the pinned toolchain hosted on the gnu target,
#   so its windows-latest jobs install that toolchain -- the
#   toolchain action's non-host install -- instead of the
#   runner's native MSVC-hosted one. Issue #517.)
#   Metric 4 and metric 3 stay on the Linux host over the full
#   survey: the JIT lowers x86_64 machine code, and metric 3's
#   candidate predicate reads only survey-classified properties;
# - metric 3 reads its stage-1 candidate set from the survey, not
#   from the merged subset results (the candidate predicate reads only
#   survey-classified properties), so it runs alongside the shards;
#   the aggregate job asserts that the set it measured is the set the
#   merged results define (ci-subset-tools.py check-candidates);
# - the aggregate job only merges JSON (no toolchain, no build) and
#   publishes the three metrics to the job summary.
#
# Runs on every push to main and on manual dispatch. The dispatch
# inputs allow other shard counts or skipping the JIT pass for a
# trial run.

on:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      shards:
        description: "Number of shards of the metric-2(b) pass"
        required: true
        default: "12"
      jit_shards:
        description: "Number of shards of the metric-4 (--jit) pass"
        required: true
        default: "4"
      run_jit:
        description: "Also measure metric 4 (--jit)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

# Official measurements never overlap each other.
concurrency:
  group: official-measure
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_SURVEY_DIR: ${{ github.workspace }}/.ci/rust-1.100.0-survey
  SURVEY_JSON: ${{ github.workspace }}/.ci/subset-survey.json
  # Where the stage-4 guest runs expect the rustdoc artifact tree
  # (restored from its cache when populated; see the measure job).
  SPARAGMOS_RUSTDOC_ARTIFACTS: ${{ github.workspace }}/.ci/rustdoc-artifacts-1.100.0
  # Hosted CPUs are slower than the dev host; per-record timeouts are
  # raised above the runner defaults (60s) so heavy records do not
  # fall over purely on CPU speed.
  SPARAGMOS_NATIVE_COMPILE_TIMEOUT: "240"
  SPARAGMOS_NATIVE_RUN_TIMEOUT: "60"
  SPARAGMOS_DRIVER_TIMEOUT: "240"
  SPARAGMOS_CONVERT_TIMEOUT: "240"
  SHARDS: ${{ inputs.shards || '12' }}
  JIT_SHARDS: ${{ inputs.jit_shards || '4' }}
  # The driver binary every job runs (downloaded from the build job's
  # artifact). Its rpath and baked-in sysroot point at the pinned
  # toolchain's rustup path, which is the same on every hosted runner.
  DRIVER_BIN: ${{ github.workspace }}/.ci/driver/sparagmos-driver

jobs:
  prepare:
    name: prepare survey
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      shard-list: ${{ steps.list.outputs.value }}
      jit-shard-list: ${{ steps.list.outputs.jit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The cached tree's shape is part of this key's meaning:
      # actions/cache never re-saves on an exact key hit, so any
      # change to the sparse-checkout set widened below must bump
      # the key in every job, or the measure jobs keep restoring
      # the old tree.
      - name: Cache rust source tree and survey
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.RUST_SURVEY_DIR }}
            ${{ env.SURVEY_JSON }}
          key: rust-survey-1.100.0-v4

      - name: Fetch rust tree and generate survey (on cache miss)
        run: |
          if [ ! -d "$RUST_SURVEY_DIR" ]; then
            python3 scripts/rustc-subset-survey.py --fetch \
              --rust-dir "$RUST_SURVEY_DIR" --json "$SURVEY_JSON"
          elif [ ! -f "$SURVEY_JSON" ]; then
            python3 scripts/rustc-subset-survey.py \
              --rust-dir "$RUST_SURVEY_DIR" --json "$SURVEY_JSON"
          fi
          # The stage-3 harness extracts the run-make-support
          # sources from the tree (git archive in
          # rustc-subset-run.py), so the cached tree must carry
          # their blobs: widen the sparse checkout beyond the
          # survey's own set before the cache is saved. src/stage0,
          # also extracted, is a file directly under src/ and is
          # already included by the cone-mode parent rules.
          # src/etc carries htmldocck.py, which run-make-support's
          # `htmldocck()` helper executes from the source root, and
          # src/librustdoc/html/static/css is read directly by the
          # rustdoc themes recipe; without them those recipes fail
          # on the native side of stage 3. The stage-4 harness
          # likewise extracts src/etc/htmldocck.py and the
          # jsondocck / jsondoclint sources from the tree and runs
          # the guest rustdoc from src/tools/rustdoc/main.rs, so
          # those are widened too.
          git -C "$RUST_SURVEY_DIR" sparse-checkout add \
            src/tools/run-make-support src/build_helper \
            src/rustdoc-json-types src/etc \
            src/librustdoc/html/static/css src/tools/jsondocck \
            src/tools/jsondoclint src/tools/rustdoc
          ls -la "$SURVEY_JSON"

      - name: Upload survey
        uses: actions/upload-artifact@v4
        with:
          name: subset-survey
          path: ${{ env.SURVEY_JSON }}
          retention-days: 7

      # The partition evaluates every record's headers under each
      # host class's model; the target-spec facts come from the
      # pinned toolchain, so install it (no extra components) for
      # that query.
      - name: Install Rust 1.100.0 (for the partition's spec query)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0

      - name: Partition survey by host class
        run: |
          python3 scripts/ci-subset-tools.py partition \
            --survey "$SURVEY_JSON" \
            --tree "$RUST_SURVEY_DIR" \
            --out-dir "$RUNNER_TEMP/host-surveys"

      - name: Upload host-class surveys
        uses: actions/upload-artifact@v4
        with:
          name: subset-survey-hosts
          path: ${{ runner.temp }}/host-surveys
          retention-days: 7

      - name: Compute shard lists
        id: list
        run: |
          value="$(python3 -c "import json,os; print(json.dumps(list(range(int(os.environ['SHARDS'])))))")"
          jit="$(python3 -c "import json,os; print(json.dumps(list(range(int(os.environ['JIT_SHARDS'])))))")"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "jit=$jit" >> "$GITHUB_OUTPUT"

  # The driver is built once and shared. The `measure` profile keeps
  # the dev profile's semantics (debug assertions and overflow checks
  # on) with the optimizer on, so a record behaves as under a debug
  # build and only runs faster (docs/CI.md). This job needs no
  # cross-target std: the measure jobs install those for the
  # runner's compile-flags screening.
  build:
    name: build driver
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.100.0 with rustc-dev
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustc-dev

      - name: Cache cargo registry and driver target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/sparagmos-driver -> target
          # The sparagmos-* path crates are most of the build; keep
          # their artifacts so an unchanged crate is not recompiled.
          cache-workspace-crates: true

      - name: Build driver (measure profile)
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          cargo build --profile measure \
            --manifest-path crates/sparagmos-driver/Cargo.toml
          ls -la crates/sparagmos-driver/target/measure/sparagmos-driver

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: sparagmos-driver
          path: crates/sparagmos-driver/target/measure/sparagmos-driver
          retention-days: 7
          if-no-files-found: error

  # The other host classes' drivers, built natively on each
  # class's own runner: the driver is a rustc driver bound to its
  # host toolchain, so no class can run another class's build.
  # The run steps use bash on every runner (Git Bash on Windows),
  # and the Windows build's binary carries the .exe suffix the
  # matrix names per class. The matrix's host key names the
  # toolchain descriptor the install step selects: the plain
  # pinned release, except for windows-gnu, whose descriptor is
  # the pinned release hosted on the gnu target.
  build-host:
    name: build driver (${{ matrix.class }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - class: linux-aarch64
            runner: ubuntu-24.04-arm
            bin: sparagmos-driver
            host: 1.100.0
          - class: darwin-aarch64
            runner: macos-15
            bin: sparagmos-driver
            host: 1.100.0
          - class: darwin-x86_64
            runner: macos-15-intel
            bin: sparagmos-driver
            host: 1.100.0
          - class: windows-msvc
            runner: windows-latest
            bin: sparagmos-driver.exe
            host: 1.100.0
          - class: windows-gnu
            runner: windows-latest
            bin: sparagmos-driver.exe
            host: 1.100.0-x86_64-pc-windows-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.100.0 with rustc-dev
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.host }}
          components: rustc-dev

      # The toolchain action sets a non-host toolchain as the
      # default on a best-effort basis; assert it took, so this
      # class never silently runs on the runner's native
      # MSVC-hosted toolchain instead.
      - name: Verify the gnu-hosted toolchain is the default
        if: matrix.class == 'windows-gnu'
        run: "rustc -vV | grep -q '^host: x86_64-pc-windows-gnu$'"

      - name: Cache cargo registry and driver target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/sparagmos-driver -> target
          cache-workspace-crates: true

      - name: Build driver (measure profile)
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          cargo build --profile measure \
            --manifest-path crates/sparagmos-driver/Cargo.toml
          ls -la crates/sparagmos-driver/target/measure/${{ matrix.bin }}

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: sparagmos-driver-${{ matrix.class }}
          path: crates/sparagmos-driver/target/measure/${{ matrix.bin }}
          retention-days: 7
          if-no-files-found: error

  measure:
    name: measure shard ${{ matrix.shard }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shard-list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.100.0 with rustc-dev
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustc-dev, rust-src
          # Install every target rustup distributes for the
          # pinned toolchain: the subset runner screens a
          # record's compile-flags --target against the sysroot's
          # installed targets (installed_targets() in
          # rustc-subset-run.py), and a known triple with no
          # installed std is reported as "not attempted
          # (compile-flags)" while staying in the denominator.
          # With only the host target installed, 209 compile-check
          # records were never attempted (Issue #381). With the
          # complete catalogue installed (119 triples; the dev
          # host's pinned toolchain carries the same set), the
          # only triples a record can still be refused for are
          # ones the channel does not distribute at all: tier-3
          # targets with no prebuilt std in 1.100.0 (Issue #516).
          targets: >-
            aarch64-apple-darwin,
            aarch64-apple-ios,
            aarch64-apple-ios-macabi,
            aarch64-apple-ios-sim,
            aarch64-apple-tvos,
            aarch64-apple-tvos-sim,
            aarch64-apple-visionos,
            aarch64-apple-visionos-sim,
            aarch64-apple-watchos,
            aarch64-apple-watchos-sim,
            aarch64-linux-android,
            aarch64-pc-windows-gnullvm,
            aarch64-pc-windows-msvc,
            aarch64-unknown-freebsd,
            aarch64-unknown-fuchsia,
            aarch64-unknown-linux-gnu,
            aarch64-unknown-linux-musl,
            aarch64-unknown-linux-ohos,
            aarch64-unknown-none,
            aarch64-unknown-none-softfloat,
            aarch64-unknown-uefi,
            arm-linux-androideabi,
            arm-unknown-linux-gnueabi,
            arm-unknown-linux-gnueabihf,
            arm-unknown-linux-musleabi,
            arm-unknown-linux-musleabihf,
            arm64ec-pc-windows-msvc,
            armv5te-unknown-linux-gnueabi,
            armv5te-unknown-linux-musleabi,
            armv7-linux-androideabi,
            armv7-unknown-linux-gnueabi,
            armv7-unknown-linux-gnueabihf,
            armv7-unknown-linux-musleabi,
            armv7-unknown-linux-musleabihf,
            armv7-unknown-linux-ohos,
            armv7a-none-eabi,
            armv7a-none-eabihf,
            armv7r-none-eabi,
            armv7r-none-eabihf,
            armv8r-none-eabihf,
            i586-unknown-linux-gnu,
            i586-unknown-linux-musl,
            i686-linux-android,
            i686-pc-windows-gnu,
            i686-pc-windows-gnullvm,
            i686-pc-windows-msvc,
            i686-unknown-freebsd,
            i686-unknown-linux-gnu,
            i686-unknown-linux-musl,
            i686-unknown-uefi,
            loongarch32-unknown-none,
            loongarch32-unknown-none-softfloat,
            loongarch64-unknown-linux-gnu,
            loongarch64-unknown-linux-musl,
            loongarch64-unknown-none,
            loongarch64-unknown-none-softfloat,
            nvptx64-nvidia-cuda,
            powerpc-unknown-linux-gnu,
            powerpc64-unknown-linux-gnu,
            powerpc64-unknown-linux-musl,
            powerpc64le-unknown-linux-gnu,
            powerpc64le-unknown-linux-musl,
            riscv32i-unknown-none-elf,
            riscv32im-unknown-none-elf,
            riscv32imac-unknown-none-elf,
            riscv32imafc-unknown-none-elf,
            riscv32imc-unknown-none-elf,
            riscv64a23-unknown-linux-gnu,
            riscv64gc-unknown-linux-gnu,
            riscv64gc-unknown-linux-musl,
            riscv64gc-unknown-none-elf,
            riscv64imac-unknown-none-elf,
            s390x-unknown-linux-gnu,
            sparc64-unknown-linux-gnu,
            sparcv9-sun-solaris,
            thumbv6m-none-eabi,
            thumbv7a-none-eabi,
            thumbv7a-none-eabihf,
            thumbv7em-none-eabi,
            thumbv7em-none-eabihf,
            thumbv7m-none-eabi,
            thumbv7neon-linux-androideabi,
            thumbv7neon-unknown-linux-gnueabihf,
            thumbv7r-none-eabi,
            thumbv7r-none-eabihf,
            thumbv8m.base-none-eabi,
            thumbv8m.main-none-eabi,
            thumbv8m.main-none-eabihf,
            thumbv8r-none-eabihf,
            wasm32-unknown-emscripten,
            wasm32-unknown-unknown,
            wasm32-wasip1,
            wasm32-wasip1-threads,
            wasm32-wasip2,
            wasm32-wasip3,
            wasm32v1-none,
            x86_64-apple-darwin,
            x86_64-apple-ios,
            x86_64-apple-ios-macabi,
            x86_64-fortanix-unknown-sgx,
            x86_64-linux-android,
            x86_64-pc-solaris,
            x86_64-pc-windows-gnu,
            x86_64-pc-windows-gnullvm,
            x86_64-pc-windows-msvc,
            x86_64-unknown-freebsd,
            x86_64-unknown-fuchsia,
            x86_64-unknown-illumos,
            x86_64-unknown-linux-gnu,
            x86_64-unknown-linux-gnuasan,
            x86_64-unknown-linux-gnumsan,
            x86_64-unknown-linux-gnutsan,
            x86_64-unknown-linux-gnux32,
            x86_64-unknown-linux-musl,
            x86_64-unknown-linux-ohos,
            x86_64-unknown-netbsd,
            x86_64-unknown-none,
            x86_64-unknown-redox,
            x86_64-unknown-uefi

      # Tier-3 std completion (Issue #516): for triples the
      # 1.100.0 channel does not distribute, build std from
      # source with the pinned compiler itself and install it
      # into this sysroot, so the runner's installed-target
      # screening admits the records that name them. The
      # installed sysroot directory is cached; on a hit the
      # build script sees the std already present and skips.
      # When the script's TIER3_STD table changes, bump the
      # cache key version.
      - name: Resolve sysroot
        id: sysroot
        run: echo "path=$(rustup run 1.100.0 rustc --print sysroot)" >> "$GITHUB_OUTPUT"

      - name: Cache tier-3 std sysroots
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/aarch64-unknown-linux-pauthtest
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/aarch64-unknown-trusty
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/aarch64_be-unknown-linux-gnu
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/aarch64v8r-unknown-none
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/aarch64v8r-unknown-none-softfloat
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/amdgcn-amd-amdhsa
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/armebv7r-none-eabi
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/armebv7r-none-eabihf
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/armv5te-none-eabi
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/armv7k-apple-watchos
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/armv7s-apple-ios
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/avr-none
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/bpfeb-unknown-none
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/bpfel-unknown-none
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/csky-unknown-linux-gnuabiv2
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/hexagon-unknown-linux-musl
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/i386-apple-ios
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/i686-apple-darwin
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/i686-uwp-windows-gnu
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/m68k-unknown-linux-gnu
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/m68k-unknown-none-elf
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mips-mti-none-elf
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mips-unknown-linux-gnu
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mips-unknown-linux-musl
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mips-unknown-linux-uclibc
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mips64-openwrt-linux-musl
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mips64-unknown-linux-gnuabi64
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mips64-unknown-linux-muslabi64
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mips64el-unknown-linux-gnuabi64
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mips64el-unknown-linux-muslabi64
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mipsel-mti-none-elf
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mipsel-sony-psp
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mipsel-sony-psx
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mipsel-unknown-linux-gnu
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mipsel-unknown-linux-musl
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mipsel-unknown-linux-uclibc
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mipsel-unknown-netbsd
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mipsel-unknown-none
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mipsisa32r6-unknown-linux-gnu
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mipsisa32r6el-unknown-linux-gnu
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mipsisa64r6-unknown-linux-gnuabi64
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/mipsisa64r6el-unknown-linux-gnuabi64
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/msp430-none-elf
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/powerpc-unknown-linux-gnuspe
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/powerpc64-ibm-aix
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/riscv32e-unknown-none-elf
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/riscv32em-unknown-none-elf
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/riscv32emc-unknown-none-elf
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/riscv32gc-unknown-linux-gnu
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/riscv32gc-unknown-linux-musl
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/riscv64gc-unknown-fuchsia
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/s390x-unknown-none-softfloat
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/sparc-unknown-linux-gnu
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/sparc-unknown-none-elf
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/thumbv4t-none-eabi
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/thumbv5te-none-eabi
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/wasm64-unknown-unknown
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/x86_64-unknown-hermit
            ${{ steps.sysroot.outputs.path }}/lib/rustlib/x86_64-uwp-windows-gnu
          key: tier3-std-1.100.0-v4

      - name: Build tier-3 std from source
        run: python3 scripts/build-tier3-std.py

      - name: Restore rust source tree
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.RUST_SURVEY_DIR }}
            ${{ env.SURVEY_JSON }}
          key: rust-survey-1.100.0-v4
          fail-on-cache-miss: true

      # The Linux class's slice of the host partition (the
      # prepare job's partition step): these jobs judge exactly
      # the records the Linux host model admits, plus the records
      # no enabled class admits, which stay here as the residual
      # class.
      - name: Download host-class surveys
        uses: actions/download-artifact@v4
        with:
          name: subset-survey-hosts
          path: ${{ runner.temp }}/host-surveys

      # upload-artifact does not keep file modes, so the executable
      # bit is restored after the download.
      - name: Download driver
        uses: actions/download-artifact@v4
        with:
          name: sparagmos-driver
          path: ${{ github.workspace }}/.ci/driver

      - name: Make driver executable
        run: |
          chmod +x "$DRIVER_BIN"
          ls -la "$DRIVER_BIN"

      # The stage-4 guest runs use the rustdoc artifact tree
      # when its cache has been populated (building the tree
      # compiles the whole compiler-crate closure from source
      # and does not fit these jobs; see docs/CI.md). On a cache
      # miss the directory simply stays absent and the runner
      # records the oracle-passing rustdoc records as not
      # attempted (rustdoc artifact tree unavailable).
      - name: Restore rustdoc artifact tree
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SPARAGMOS_RUSTDOC_ARTIFACTS }}
          key: rustdoc-artifacts-1.100.0-v1

      # --stages all: stages 1+2 plus the stage-3 procedure
      # harness and the stage-4 rustdoc harness, so the
      # procedure and rustdoc-check records are attempted in the
      # official metric-2(b) pass.
      - name: Run shard
        run: |
          python3 scripts/ci-subset-tools.py shard \
            --survey "$RUNNER_TEMP/host-surveys/subset-survey-linux-x86_64.json" \
            --count "$SHARDS" --index "${{ matrix.shard }}" \
            --out "$RUNNER_TEMP/shard-survey.json"
          python3 scripts/rustc-subset-run.py \
            --survey-json "$RUNNER_TEMP/shard-survey.json" \
            --rust-dir "$RUST_SURVEY_DIR" \
            --driver-bin "$DRIVER_BIN" \
            --out "$RUNNER_TEMP/subset-shard-${{ matrix.shard }}.json" \
            --stages all \
            --jobs 2

      # Runs on failure too: when a shard step fails or is killed,
      # the runner's last incremental snapshot (marked
      # "complete": false) is still uploaded so the partial results
      # can be recovered by hand. The aggregate merge refuses
      # partial inputs, so a recovered snapshot is never merged as
      # a complete result.
      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subset-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/subset-shard-${{ matrix.shard }}.json
          retention-days: 30

  measure-jit:
    name: measure (jit) shard ${{ matrix.shard }}
    needs: [prepare, build]
    if: ${{ github.event_name == 'push' || inputs.run_jit }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.jit-shard-list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.100.0 with rustc-dev
        uses: dtolnay/rust-toolchain@master
