          # installed targets (installed_targets() in
          # rustc-subset-run.py), and a known triple with no
          # installed std is reported as "not attempted
          # (compile-flags)" while staying in the denominator.
          # With only the host target installed, 209 compile-check
          # records were never attempted (Issue #381). With the
          # complete catalogue installed (119 triples; the dev
          # host's pinned toolchain carries the same set), the
          # only triples a record can still be refused for are
          # ones the channel does not distribute at all: tier-3
          # targets with no prebuilt std in 1.100.0 (Issue #516).
          targets: >-
            aarch64-apple-darwin,
            aarch64-apple-ios,
            aarch64-apple-ios-macabi,
            aarch64-apple-ios-sim,
            aarch64-apple-tvos,
            aarch64-apple-tvos-sim,
            aarch64-apple-visionos,
            aarch64-apple-visionos-sim,
            aarch64-apple-watchos,
            aarch64-apple-watchos-sim,
            aarch64-linux-android,
            aarch64-pc-windows-gnullvm,
            aarch64-pc-windows-msvc,
            aarch64-unknown-freebsd,
            aarch64-unknown-fuchsia,
            aarch64-unknown-linux-gnu,
            aarch64-unknown-linux-musl,
            aarch64-unknown-linux-ohos,
            aarch64-unknown-none,
            aarch64-unknown-none-softfloat,
            aarch64-unknown-uefi,
            arm-linux-androideabi,
            arm-unknown-linux-gnueabi,
            arm-unknown-linux-gnueabihf,
            arm-unknown-linux-musleabi,
            arm-unknown-linux-musleabihf,
            arm64ec-pc-windows-msvc,
            armv5te-unknown-linux-gnueabi,
            armv5te-unknown-linux-musleabi,
            armv7-linux-androideabi,
            armv7-unknown-linux-gnueabi,
            armv7-unknown-linux-gnueabihf,
            armv7-unknown-linux-musleabi,
            armv7-unknown-linux-musleabihf,
            armv7-unknown-linux-ohos,
