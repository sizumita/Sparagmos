  # The host classes' metric-2(b) shards: each class's records
  # are judged natively on a runner of that host, with the driver
  # the matching build-host job built there and the runner's host
  # model selected through SPARAGMOS_HOST_TARGET. The result
  # files carry the measure jobs' subset-shard-* names, so the
  # aggregate merges them with no special case; the partition
  # guarantees the classes are disjoint and cover the survey, so
  # the aggregate's denominator assertion is unchanged. The
  # rustdoc artifact tree is NOT restored here: it is a
  # Linux-built tree, so a class record whose stage 4 needs it
  # records the same not-attempted verdict the Linux jobs record
  # on a cache miss. The run steps use bash on every runner (Git
  # Bash on Windows), and the fetch step pins core.autocrlf off
  # so the tree a Windows job clones is byte-identical to the
  # other hosts' trees.
  measure-host:
    name: measure (${{ matrix.class }}) shard ${{ matrix.shard }}
    needs: [prepare, build-host]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    env:
      # The downloaded driver artifact's file name (the Windows
      # build carries the .exe suffix); overrides the workflow
      # env's DRIVER_BIN for this job's classes.
      DRIVER_BIN: ${{ github.workspace }}/.ci/driver/${{ matrix.bin }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - class: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            bin: sparagmos-driver
            host: 1.100.0
            shard: 0
          - class: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            bin: sparagmos-driver
            host: 1.100.0
            shard: 1
          - class: darwin-aarch64
            target: aarch64-apple-darwin
            runner: macos-15
            bin: sparagmos-driver
            host: 1.100.0
            shard: 0
          - class: darwin-aarch64
            target: aarch64-apple-darwin
            runner: macos-15
            bin: sparagmos-driver
            host: 1.100.0
            shard: 1
          - class: darwin-x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            bin: sparagmos-driver
            host: 1.100.0
            shard: 0
          - class: darwin-x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            bin: sparagmos-driver
            host: 1.100.0
            shard: 1
          - class: windows-msvc
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            bin: sparagmos-driver.exe
            host: 1.100.0
            shard: 0
          - class: windows-msvc
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            bin: sparagmos-driver.exe
            host: 1.100.0
            shard: 1
          - class: windows-gnu
            target: x86_64-pc-windows-gnu
            runner: windows-latest
            bin: sparagmos-driver.exe
            host: 1.100.0-x86_64-pc-windows-gnu
            shard: 0
          - class: windows-gnu
            target: x86_64-pc-windows-gnu
            runner: windows-latest
            bin: sparagmos-driver.exe
            host: 1.100.0-x86_64-pc-windows-gnu
            shard: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The hosted macOS image's python3 is the Xcode CLT 3.9;
      # the runner scripts need a current Python on every host.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust 1.100.0 with rustc-dev
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.host }}
          components: rustc-dev
          # The same target set as the Linux measure jobs: the
          # runner screens compile-flags --target against the
          # class host's own installed targets.
          targets: >-
            aarch64-apple-darwin,
            aarch64-linux-android,
            aarch64-pc-windows-gnullvm,
            aarch64-pc-windows-msvc,
            aarch64-unknown-fuchsia,
            aarch64-unknown-linux-gnu,
            aarch64-unknown-none,
            aarch64-unknown-none-softfloat,
            arm-unknown-linux-gnueabi,
            arm64ec-pc-windows-msvc,
            armv5te-unknown-linux-gnueabi,
            armv7-linux-androideabi,
            armv7-unknown-linux-gnueabi,
            armv7-unknown-linux-gnueabihf,
            armv7r-none-eabi,
            armv7r-none-eabihf,
            armv8r-none-eabihf,
            i586-unknown-linux-gnu,
            i686-pc-windows-gnu,
            i686-pc-windows-msvc,
            i686-unknown-freebsd,
            i686-unknown-linux-gnu,
            i686-unknown-linux-musl,
            loongarch32-unknown-none,
            loongarch32-unknown-none-softfloat,
            loongarch64-unknown-linux-gnu,
            loongarch64-unknown-none,
            loongarch64-unknown-none-softfloat,
            nvptx64-nvidia-cuda,
            powerpc-unknown-linux-gnu,
            powerpc64-unknown-linux-gnu,
            powerpc64le-unknown-linux-gnu,
            riscv32i-unknown-none-elf,
            riscv32im-unknown-none-elf,
            riscv32imac-unknown-none-elf,
            riscv32imc-unknown-none-elf,
            riscv64gc-unknown-linux-gnu,
            riscv64gc-unknown-none-elf,
            riscv64imac-unknown-none-elf,
            s390x-unknown-linux-gnu,
            sparc64-unknown-linux-gnu,
            sparcv9-sun-solaris,
            thumbv6m-none-eabi,
            thumbv7em-none-eabi,
            thumbv7em-none-eabihf,
            thumbv8m.main-none-eabi,
            thumbv8m.main-none-eabihf,
            wasm32-unknown-emscripten,
            wasm32-unknown-unknown,
            wasm32-wasip1,
            x86_64-apple-darwin,
            x86_64-fortanix-unknown-sgx,
            x86_64-pc-windows-gnu,
            x86_64-pc-windows-msvc,
            x86_64-unknown-linux-gnu,
            x86_64-unknown-linux-gnux32,
            x86_64-unknown-linux-musl,
            x86_64-unknown-none,
            x86_64-unknown-uefi
      # The toolchain action sets a non-host toolchain as the
      # default on a best-effort basis; assert it took, so this
      # class never silently runs on the runner's native
      # MSVC-hosted toolchain instead.
      - name: Verify the gnu-hosted toolchain is the default
        if: matrix.class == 'windows-gnu'
        run: "rustc -vV | grep -q '^host: x86_64-pc-windows-gnu$'"

      - name: Restore rust source tree
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.RUST_SURVEY_DIR }}
            ${{ env.SURVEY_JSON }}
          key: rust-survey-1.100.0-v4

      # The cache service segments entries by runner (OS and
      # architecture), so the tree the Linux prepare job saved
      # is not necessarily the entry a host class restores: on
      # a miss this job fetches and widens the tree exactly as
      # prepare does (and the cache step above then saves this
      # host's entry under the same key for later runs).
      - name: Fetch rust tree and generate survey (on cache miss)
        run: |
          git config --global core.autocrlf false
          if [ ! -d "$RUST_SURVEY_DIR" ]; then
            python3 scripts/rustc-subset-survey.py --fetch \
              --rust-dir "$RUST_SURVEY_DIR" --json "$SURVEY_JSON"
          elif [ ! -f "$SURVEY_JSON" ]; then
            python3 scripts/rustc-subset-survey.py \
              --rust-dir "$RUST_SURVEY_DIR" --json "$SURVEY_JSON"
          fi
          git -C "$RUST_SURVEY_DIR" sparse-checkout add \
            src/tools/run-make-support src/build_helper \
            src/rustdoc-json-types src/etc \
            src/librustdoc/html/static/css src/tools/jsondocck \
            src/tools/jsondoclint src/tools/rustdoc

      - name: Download host-class surveys
        uses: actions/download-artifact@v4
        with:
          name: subset-survey-hosts
          path: ${{ runner.temp }}/host-surveys

      # upload-artifact does not keep file modes, so the
      # executable bit is restored after the download.
      - name: Download driver
        uses: actions/download-artifact@v4
        with:
          name: sparagmos-driver-${{ matrix.class }}
          path: ${{ github.workspace }}/.ci/driver

      - name: Make driver executable
        run: |
          chmod +x "$DRIVER_BIN"
          ls -la "$DRIVER_BIN"

      - name: Run shard
        env:
          SPARAGMOS_HOST_TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/ci-subset-tools.py shard \
            --survey "$RUNNER_TEMP/host-surveys/subset-survey-${{ matrix.class }}.json" \
            --count 2 --index "${{ matrix.shard }}" \
            --out "$RUNNER_TEMP/shard-survey.json"
          python3 scripts/rustc-subset-run.py \
            --survey-json "$RUNNER_TEMP/shard-survey.json" \
            --rust-dir "$RUST_SURVEY_DIR" \
            --driver-bin "$DRIVER_BIN" \
            --out "$RUNNER_TEMP/subset-shard-${{ matrix.class }}-${{ matrix.shard }}.json" \
            --stages all \
            --jobs 2

      # Runs on failure too: when a shard step fails or is killed,
      # the runner's last incremental snapshot (marked
      # "complete": false) is still uploaded so the partial results
      # can be recovered by hand. The aggregate merge refuses
      # partial inputs, so a recovered snapshot is never merged as
      # a complete result.
      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subset-shard-${{ matrix.class }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/subset-shard-${{ matrix.class }}-${{ matrix.shard }}.json
          retention-days: 30

  # Metric 3 over the survey's stage-1 candidates, alongside the
  # shards (the aggregate job checks the candidate set against the
  # merged results).
  metric3:
    name: metric 3 (std coverage)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.100.0 with rustc-dev
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustc-dev

      - name: Restore rust source tree
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.RUST_SURVEY_DIR }}
            ${{ env.SURVEY_JSON }}
          key: rust-survey-1.100.0-v4
          fail-on-cache-miss: true

      - name: Download survey
        uses: actions/download-artifact@v4
        with:
          name: subset-survey
          path: ${{ runner.temp }}

      # upload-artifact does not keep file modes, so the executable
      # bit is restored after the download.
      - name: Download driver
        uses: actions/download-artifact@v4
        with:
          name: sparagmos-driver
          path: ${{ github.workspace }}/.ci/driver

      - name: Make driver executable
        run: |
          chmod +x "$DRIVER_BIN"
          ls -la "$DRIVER_BIN"

      - name: Metric 3 (std coverage)
        run: |
          python3 scripts/std-coverage.py \
            --survey-json "$RUNNER_TEMP/subset-survey.json" \
            --rust-dir "$RUST_SURVEY_DIR" \
            --driver-bin "$DRIVER_BIN" \
            --out "$RUNNER_TEMP/std-coverage.json" \
            --jobs 2 --timeout 240

      - name: Upload std coverage
        uses: actions/upload-artifact@v4
        with:
          name: std-coverage
          path: ${{ runner.temp }}/std-coverage.json
          retention-days: 30

  aggregate:
    name: aggregate metrics
    needs: [measure, measure-host, measure-jit, metric3]
    if: >-
      always() && needs.measure.result == 'success' &&
      needs.measure-host.result == 'success' &&
      needs.metric3.result == 'success' &&
      (needs.measure-jit.result == 'success' || needs.measure-jit.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The survey the shards were cut from (the prepare job's
      # upload of the cached survey).
      - name: Download survey
        uses: actions/download-artifact@v4
        with:
          name: subset-survey
          path: ${{ runner.temp }}

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: subset-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true

      - name: Download JIT shard results
        if: ${{ needs.measure-jit.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: subset-jit-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true

      - name: Download std coverage
        uses: actions/download-artifact@v4
        with:
          name: std-coverage
          path: ${{ runner.temp }}

      # The denominator is asserted, not derived: the merge fails
      # unless the survey and the merged records both total 24,937
      # with the expected per-nature split, so a regenerated or
      # truncated survey cannot silently change the official value.
      - name: Merge subset results (metric 2(b))
        run: |
          python3 scripts/ci-subset-tools.py merge \
            --out "$RUNNER_TEMP/subset-merged.json" \
            --summary "$RUNNER_TEMP/metric2b.md" \
            --expect-total 24937 \
            --expect-nature exec=4149 \
            --expect-nature procedure=551 \
            --expect-nature exec-debugger=170 \
            --expect-nature compile-check=18332 \
            --expect-nature rustdoc-check=1735 \
            --survey "$RUNNER_TEMP/subset-survey.json" \
            "$RUNNER_TEMP"/shards/subset-shard-*.json
          cat "$RUNNER_TEMP/metric2b.md" >> "$GITHUB_STEP_SUMMARY"

      # Metric 3 was measured over the survey's candidates; it is
      # published only when they are exactly the stage-1 candidates
      # of the merged results.
      - name: Metric 3 (std coverage)
        run: |
          python3 scripts/ci-subset-tools.py check-candidates \
            --coverage "$RUNNER_TEMP/std-coverage.json" \
            --results "$RUNNER_TEMP/subset-merged.json"
          python3 - "$RUNNER_TEMP/std-coverage.json" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          agg = json.load(open(sys.argv[1]))["aggregate"]
          pct = round(100.0 * agg["rate"], 3)
          print("## Metric 3\n")
          print(f"**{agg['executable']}/{agg['denominator']} = {pct}%** "
                f"(strict: {agg['executable_strict']}, "
                f"{round(100.0 * agg['rate_strict'], 3)}%)\n")
          EOF

      - name: Merge JIT results (metric 4)
        if: ${{ needs.measure-jit.result == 'success' }}
        run: |
          python3 scripts/ci-subset-tools.py merge \
            --out "$RUNNER_TEMP/subset-jit-merged.json" \
            --summary "$RUNNER_TEMP/metric4.md" \
            --expect-total 24937 \
            --expect-nature exec=4149 \
            --expect-nature procedure=551 \
            --expect-nature exec-debugger=170 \
            --expect-nature compile-check=18332 \
            --expect-nature rustdoc-check=1735 \
            --survey "$RUNNER_TEMP/subset-survey.json" \
            "$RUNNER_TEMP"/shards/subset-jit-shard-*.json
          cat "$RUNNER_TEMP/metric4.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-measurement-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/subset-merged.json
            ${{ runner.temp }}/subset-jit-merged.json
            ${{ runner.temp }}/std-coverage.json
          retention-days: 90
