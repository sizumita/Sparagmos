name: Flip Diff

# Runs the metric-2(b) subset runner over a topical population with the
# base driver and the head driver, and reports gains and losses. This
# automates the flip-diff check the lanes run on the dev host: pick a
# population by path keywords, run both drivers over it, and compare
# per-record verdicts (a record passes when its bucket is empty). The
# full official measurement is the Official Measurement workflow, not
# this one.
#
# Keyword resolution order:
# (a) the workflow_dispatch input,
# (b) a `flip-diff:<kw1+kw2+...>` label on the pull request (keywords
#     are matched as substrings of the test paths; `+` is the separator
#     because label names cannot contain commas),
# (c) a `Flip-diff keywords: kw1+kw2+...` line in the pull request body
#     (for long keyword sets that do not fit in a label: GitHub caps
#     label names at 50 characters).
#
# Triggering and gating:
# - On pull_request this job always runs as a required status check
#   for GitHub-native auto-merge. If no keywords can be resolved it
#   succeeds without measuring. If the diff contains any loss, the
#   job FAILS and auto-merge is blocked.
# - A labelled pull request re-runs automatically on every push.
# - workflow_dispatch runs are reporting only: they never fail on
#   losses. The dispatch form takes the target explicitly (a PR
#   number, or a head ref plus a base ref), so it also works for pull
#   requests whose branch does not carry this workflow file yet: the
#   measurement scripts are taken from the ref the workflow was
#   dispatched on, and only the code under test comes from the
#   target ref.
#
# The result lands in the job summary and, when a PR is known, as a
# comment on the PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      keywords:
        description: "Comma-separated path substrings for the population"
        required: true
      pr_number:
        description: "PR to measure and comment on (optional; resolves head/base from the PR)"
        required: false
        default: ""
      head_ref:
        description: "Head ref to measure (optional; overrides pr_number's head)"
        required: false
        default: ""
      base_ref:
        description: "Base ref to compare against (optional; default: the PR's base, else main)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

# Runs are serialised per measurement target (one pull request, or one
# dispatched target): a re-run for the same target queues behind the
# previous run instead of cancelling it. Different targets measure in
# parallel; every job gets its own hosted runner, so no cross-target
# serialisation is needed.
concurrency:
  group: flip-diff-${{ github.event.pull_request.number || inputs.pr_number || inputs.head_ref || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_SURVEY_DIR: ${{ github.workspace }}/.ci/rust-1.100.0-survey
  SURVEY_JSON: ${{ github.workspace }}/.ci/subset-survey.json
  # Hosted CPUs are slower than the dev host; per-record timeouts are
  # raised above the runner defaults (60s) so heavy records do not
  # fall over purely on CPU speed.
  SPARAGMOS_NATIVE_COMPILE_TIMEOUT: "240"
  SPARAGMOS_NATIVE_RUN_TIMEOUT: "60"
  SPARAGMOS_DRIVER_TIMEOUT: "240"
  SPARAGMOS_CONVERT_TIMEOUT: "240"

jobs:
  flip-diff:
    name: flip-diff
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Resolve target (keywords, head, base, PR)
        id: cfg
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_REPO: ${{ github.repository }}
          INPUT_KEYWORDS: ${{ inputs.keywords }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_HEAD: ${{ inputs.head_ref }}
          INPUT_BASE: ${{ inputs.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            keywords="$INPUT_KEYWORDS"
            pr_number="$INPUT_PR"
            head_ref="$INPUT_HEAD"
            base_ref="$INPUT_BASE"
            if [ -n "$pr_number" ]; then
              pr_refs="$(gh pr view "$pr_number" \
                --json headRefOid,baseRefName \
                --jq '.headRefOid + " " + .baseRefName')"
              read -r pr_head pr_base <<<"$pr_refs"
              head_ref="${head_ref:-$pr_head}"
              base_ref="${base_ref:-$pr_base}"
            fi
            head_ref="${head_ref:-${{ github.sha }}}"
            base_ref="${base_ref:-main}"
          else
            keywords="$(echo "$LABELS_JSON" | jq -r '[.[] | select(startswith("flip-diff:"))][0] // "" | ltrimstr("flip-diff:") | gsub("\\+"; ",")')"
            if [ -z "$keywords" ] && [ -n "$PR_BODY" ]; then
              body_line="$(printf '%s\n' "$PR_BODY" | grep -i 'flip-diff keywords:' | head -n 1 || true)"
              if [ -n "$body_line" ]; then
                keywords="$(printf '%s' "$body_line" | sed 's/^.*flip-diff keywords://I' | tr -d '`[:space:]' | tr '+' ',')"
              fi
            fi
            pr_number="$PR_NUMBER"
            head_ref="$PR_HEAD_SHA"
            base_ref="$PR_BASE_SHA"
          fi
          if [ -z "$keywords" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::no flip-diff keywords resolved (label flip-diff:<kw1+kw2+...> or dispatch input required)"
              exit 1
            fi
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "keywords=" >> "$GITHUB_OUTPUT"
            echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
            echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "no flip-diff keywords resolved; skipping measurement"
            exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"
          echo "keywords=$keywords" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "keywords: $keywords; head: $head_ref; base: $base_ref; pr: $pr_number"

      - name: No flip-diff targets
        if: steps.cfg.outputs.skip == '1'
        run: echo "No flip-diff targets resolved; skipping measurement." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout target head
        if: steps.cfg.outputs.skip != '1'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.cfg.outputs.head_ref }}
          fetch-depth: 0

      # The workflow scripts are checked out after the target head:
      # a checkout into the workspace root cleans the workspace and
      # would delete a scripts checkout made before it.
      - name: Checkout workflow scripts
        if: steps.cfg.outputs.skip != '1'
        uses: actions/checkout@v4
        with:
          path: .wf

      - name: Install Rust 1.100.0 with rustc-dev
        if: steps.cfg.outputs.skip != '1'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustc-dev, rust-src
          # Install every target rustup distributes for the
          # pinned toolchain: the subset runner screens a
          # record's compile-flags --target against the sysroot's
          # installed targets (installed_targets() in
          # rustc-subset-run.py), and a known triple with no
          # installed std is reported as "not attempted
          # (compile-flags)" while staying in the denominator.
          # With only the host target installed, 209 compile-check
          # records were never attempted (Issue #381). With the
          # complete catalogue installed (119 triples; the dev
          # host's pinned toolchain carries the same set), the
          # only triples a record can still be refused for are
          # ones the channel does not distribute at all: tier-3
          # targets with no prebuilt std in 1.100.0 (Issue #516).
          targets: >-
            aarch64-apple-darwin,
            aarch64-apple-ios,
            aarch64-apple-ios-macabi,
            aarch64-apple-ios-sim,
            aarch64-apple-tvos,
            aarch64-apple-tvos-sim,
            aarch64-apple-visionos,
            aarch64-apple-visionos-sim,
            aarch64-apple-watchos,
            aarch64-apple-watchos-sim,
            aarch64-linux-android,
            aarch64-pc-windows-gnullvm,
            aarch64-pc-windows-msvc,
            aarch64-unknown-freebsd,
            aarch64-unknown-fuchsia,
            aarch64-unknown-linux-gnu,
            aarch64-unknown-linux-musl,
            aarch64-unknown-linux-ohos,
            aarch64-unknown-none,
            aarch64-unknown-none-softfloat,
            aarch64-unknown-uefi,
            arm-linux-androideabi,
            arm-unknown-linux-gnueabi,
            arm-unknown-linux-gnueabihf,
            arm-unknown-linux-musleabi,
            arm-unknown-linux-musleabihf,
            arm64ec-pc-windows-msvc,
            armv5te-unknown-linux-gnueabi,
            armv5te-unknown-linux-musleabi,
            armv7-linux-androideabi,
            armv7-unknown-linux-gnueabi,
            armv7-unknown-linux-gnueabihf,
            armv7-unknown-linux-musleabi,
            armv7-unknown-linux-musleabihf,
            armv7-unknown-linux-ohos,
            armv7a-none-eabi,
            armv7a-none-eabihf,
            armv7r-none-eabi,
            armv7r-none-eabihf,
            armv8r-none-eabihf,
            i586-unknown-linux-gnu,
            i586-unknown-linux-musl,
            i686-linux-android,
            i686-pc-windows-gnu,
            i686-pc-windows-gnullvm,
            i686-pc-windows-msvc,
            i686-unknown-freebsd,
            i686-unknown-linux-gnu,
            i686-unknown-linux-musl,
            i686-unknown-uefi,
            loongarch32-unknown-none,
            loongarch32-unknown-none-softfloat,
            loongarch64-unknown-linux-gnu,
            loongarch64-unknown-linux-musl,
            loongarch64-unknown-none,
            loongarch64-unknown-none-softfloat,
            nvptx64-nvidia-cuda,
            powerpc-unknown-linux-gnu,
            powerpc64-unknown-linux-gnu,
            powerpc64-unknown-linux-musl,
            powerpc64le-unknown-linux-gnu,
            powerpc64le-unknown-linux-musl,
            riscv32i-unknown-none-elf,
            riscv32im-unknown-none-elf,
            riscv32imac-unknown-none-elf,
            riscv32imafc-unknown-none-elf,
            riscv32imc-unknown-none-elf,
            riscv64a23-unknown-linux-gnu,
            riscv64gc-unknown-linux-gnu,
            riscv64gc-unknown-linux-musl,
            riscv64gc-unknown-none-elf,
            riscv64imac-unknown-none-elf,
            s390x-unknown-linux-gnu,
            sparc64-unknown-linux-gnu,
            sparcv9-sun-solaris,
            thumbv6m-none-eabi,
            thumbv7a-none-eabi,
            thumbv7a-none-eabihf,
            thumbv7em-none-eabi,
            thumbv7em-none-eabihf,
            thumbv7m-none-eabi,
            thumbv7neon-linux-androideabi,
            thumbv7neon-unknown-linux-gnueabihf,
            thumbv7r-none-eabi,
            thumbv7r-none-eabihf,
            thumbv8m.base-none-eabi,
            thumbv8m.main-none-eabi,
            thumbv8m.main-none-eabihf,
            thumbv8r-none-eabihf,
            wasm32-unknown-emscripten,
            wasm32-unknown-unknown,
            wasm32-wasip1,
            wasm32-wasip1-threads,
            wasm32-wasip2,
            wasm32-wasip3,
            wasm32v1-none,
            x86_64-apple-darwin,
            x86_64-apple-ios,
            x86_64-apple-ios-macabi,
            x86_64-fortanix-unknown-sgx,
            x86_64-linux-android,
            x86_64-pc-solaris,
            x86_64-pc-windows-gnu,
            x86_64-pc-windows-gnullvm,
            x86_64-pc-windows-msvc,
            x86_64-unknown-freebsd,
            x86_64-unknown-fuchsia,
            x86_64-unknown-illumos,
            x86_64-unknown-linux-gnu,
            x86_64-unknown-linux-gnuasan,
            x86_64-unknown-linux-gnumsan,
            x86_64-unknown-linux-gnutsan,
            x86_64-unknown-linux-gnux32,
            x86_64-unknown-linux-musl,
            x86_64-unknown-linux-ohos,
            x86_64-unknown-netbsd,
            x86_64-unknown-none,
            x86_64-unknown-redox,
            x86_64-unknown-uefi

      # Tier-3 std completion (Issue #516): same sysroot
      # completion as the official measurement; see
      # scripts/build-tier3-std.py. When its TIER3_STD table
      # changes, bump the cache key version.
      - name: Resolve sysroot
        if: steps.cfg.outputs.skip != '1'
        id: sysroot
        run: echo "path=$(rustup run 1.100.0 rustc --print sysroot)" >> "$GITHUB_OUTPUT"

      - name: Cache tier-3 std sysroots
        if: steps.cfg.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: ${{ steps.sysroot.outputs.path }}/lib/rustlib/aarch64v8r-unknown-none
          key: tier3-std-1.100.0-v1-aarch64v8r-unknown-none-core-alloc

      - name: Build tier-3 std from source
        if: steps.cfg.outputs.skip != '1'
        run: python3 .wf/scripts/build-tier3-std.py

      - name: Cache rust source tree and survey
        if: steps.cfg.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.RUST_SURVEY_DIR }}
            ${{ env.SURVEY_JSON }}
          key: rust-survey-1.100.0-v1

      - name: Fetch rust tree and generate survey (on cache miss)
        if: steps.cfg.outputs.skip != '1'
        run: |
          if [ ! -d "$RUST_SURVEY_DIR" ]; then
            python3 .wf/scripts/rustc-subset-survey.py --fetch \
              --rust-dir "$RUST_SURVEY_DIR" --json "$SURVEY_JSON"
          elif [ ! -f "$SURVEY_JSON" ]; then
            python3 .wf/scripts/rustc-subset-survey.py \
              --rust-dir "$RUST_SURVEY_DIR" --json "$SURVEY_JSON"
          fi
          ls -la "$SURVEY_JSON"

      - name: Build topical population
        if: steps.cfg.outputs.skip != '1'
        run: |
          python3 .wf/scripts/ci-subset-tools.py filter \
            --survey "$SURVEY_JSON" \
            --keywords "${{ steps.cfg.outputs.keywords }}" \
            --out "$RUNNER_TEMP/population.json"

      - name: Build head driver
        if: steps.cfg.outputs.skip != '1'
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo build --manifest-path crates/sparagmos-driver/Cargo.toml

      - name: Build base driver
        if: steps.cfg.outputs.skip != '1'
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          git worktree add "$RUNNER_TEMP/base-tree" "${{ steps.cfg.outputs.base_ref }}"
          cargo build --manifest-path "$RUNNER_TEMP/base-tree/crates/sparagmos-driver/Cargo.toml"

      - name: Run subset with base driver
        if: steps.cfg.outputs.skip != '1'
        run: |
          python3 .wf/scripts/rustc-subset-run.py \
            --survey-json "$RUNNER_TEMP/population.json" \
            --rust-dir "$RUST_SURVEY_DIR" \
            --driver-bin "$RUNNER_TEMP/base-tree/crates/sparagmos-driver/target/debug/sparagmos-driver" \
            --out "$RUNNER_TEMP/base-results.json" \
            --jobs 2

      - name: Run subset with head driver
        if: steps.cfg.outputs.skip != '1'
        run: |
          python3 .wf/scripts/rustc-subset-run.py \
            --survey-json "$RUNNER_TEMP/population.json" \
            --rust-dir "$RUST_SURVEY_DIR" \
            --driver-bin "$GITHUB_WORKSPACE/crates/sparagmos-driver/target/debug/sparagmos-driver" \
            --out "$RUNNER_TEMP/head-results.json" \
            --jobs 2

      - name: Diff and report
        if: always() && steps.cfg.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cfg.outputs.pr_number }}
        run: |
          python3 .wf/scripts/ci-subset-tools.py diff \
            --base "$RUNNER_TEMP/base-results.json" \
            --head "$RUNNER_TEMP/head-results.json" \
            --summary "$RUNNER_TEMP/flip-summary.md" | tee "$RUNNER_TEMP/flip.txt"
          cat "$RUNNER_TEMP/flip-summary.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/flip-summary.md"
          fi

      - name: Upload result JSONs
        if: always() && steps.cfg.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: flip-diff-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/base-results.json
            ${{ runner.temp }}/head-results.json
            ${{ runner.temp }}/population.json
          retention-days: 30

      - name: Gate on losses
        if: always() && github.event_name == 'pull_request' && steps.cfg.outputs.skip != '1'
        run: |
          if [ ! -f "$RUNNER_TEMP/flip.txt" ]; then
            echo "::error::flip-diff result file not found ($RUNNER_TEMP/flip.txt)"
            exit 1
          fi
          loss="$(head -n 1 "$RUNNER_TEMP/flip.txt" | grep -oP 'loss: \K[0-9]+' || true)"
          if [ -z "$loss" ]; then
            echo "::error::could not parse loss count from flip-diff result"
            exit 1
          fi
          if [ "$loss" -gt 0 ]; then
            echo "::error::flip-diff found $loss loss(es); blocking auto-merge"
            exit 1
          fi
          echo "flip-diff gate passed: no losses"
