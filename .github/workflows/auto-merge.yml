name: Auto Merge

# Enables GitHub-native auto-merge (squash) on at most one pull
# request at a time: the oldest open pull request that targets main.
# A newer pull request is armed only once every older one has left
# the open queue (merged or closed), so pull requests land in FIFO
# order and a fresh pull request never jumps ahead of one that is
# still waiting.
#
# Arming conditions for that oldest pull request:
# - it is not a draft,
# - it does not change anything under .github/workflows/ (workflow
#   changes are merged manually by the integrator, as a standing
#   rule).
#
# If the oldest open pull request is a draft or changes workflows,
# nothing is armed: it waits for manual handling, and no newer pull
# request is armed in its place.
#
# Clean-status handling: GitHub rejects enabling auto-merge on a
# pull request that is already CLEAN (every required check passed
# while it waited in the queue) with "Pull request is in clean
# status". When the selected pull request is CLEAN the workflow
# therefore merges it directly with a squash merge instead of
# arming it, and the same direct merge is the fallback when the
# enable call itself reports the clean status (the state can turn
# CLEAN between selection and arming). Any other arming failure
# fails the run.
#
# This workflow only enables auto-merge or, for an already-CLEAN
# pull request, performs the merge the required status checks have
# already approved; whether a pull request actually merges is
# decided by the required status checks
# (build / test / fmt / clippy, driver / corpus (Rust 1.100.0), and
# the flip-diff gate). It runs on pull_request_target so the
# definition on main applies to every pull request regardless of
# what the branch carries, and it never checks out the pull
# request's code: it only calls the GitHub API. The closed event
# re-runs the selection so the next-oldest pull request is armed as
# soon as the previous one leaves the queue; workflow_dispatch
# allows re-running the selection by hand. Runs are serialised so
# two events cannot arm two different pull requests concurrently.

on:
  pull_request_target:
    types: [opened, reopened, closed]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    name: enable auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for the oldest open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          oldest="$(gh pr list --repo "$REPO" --state open --base main --limit 1000 \
            --json number,isDraft,autoMergeRequest,createdAt,mergeStateStatus \
            --jq 'sort_by(.createdAt) | .[0] // empty')"
          if [ -z "$oldest" ]; then
            echo "No open pull requests target main; nothing to arm."
            exit 0
          fi
          number="$(printf '%s' "$oldest" | jq -r '.number')"
          if [ "$(printf '%s' "$oldest" | jq -r '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge is already enabled for the oldest open pull request #${number}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$(printf '%s' "$oldest" | jq -r '.isDraft')" = "true" ]; then
            echo "The oldest open pull request #${number} is a draft, so auto-merge is not enabled; it waits for manual handling and no newer pull request is armed in its place." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          files="$(gh api "repos/${REPO}/pulls/${number}/files" --paginate --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -q '^\.github/workflows/'; then
            echo "The oldest open pull request #${number} changes .github/workflows/, so auto-merge is not enabled; it is merged manually." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          state="$(printf '%s' "$oldest" | jq -r '.mergeStateStatus')"
          if [ "$state" = "CLEAN" ]; then
            gh pr merge "$number" --repo "$REPO" --squash
            echo "The oldest open pull request #${number} is already CLEAN, so it was merged directly (squash) instead of arming auto-merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! arm_output="$(gh pr merge "$number" --repo "$REPO" --auto --squash 2>&1)"; then
            printf '%s\n' "$arm_output"
            if printf '%s\n' "$arm_output" | grep -q 'clean status'; then
              gh pr merge "$number" --repo "$REPO" --squash
              echo "Enabling auto-merge for the oldest open pull request #${number} reported the clean status, so it was merged directly (squash)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Enabling auto-merge for the oldest open pull request #${number} failed." >&2
            exit 1
          fi
          printf '%s\n' "$arm_output"
          echo "Auto-merge (squash) enabled for the oldest open pull request #${number}." >> "$GITHUB_STEP_SUMMARY"
