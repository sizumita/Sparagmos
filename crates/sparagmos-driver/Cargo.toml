[package]
name = "sparagmos-driver"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Sparagmos rustc driver: obtains MIR via Stable MIR (rustc_public) and converts it to sparagmos-mir"

# This crate is its own workspace on purpose: it must be built with the
# pinned Rust 1.100.0 toolchain (+ rustc-dev, RUSTC_BOOTSTRAP=1), while the
# rest of Sparagmos builds with the regular stable toolchain.
[workspace]

[dependencies]
libc = "0.2"
rustc-demangle = "0.1"
sparagmos-mir = { path = "../sparagmos-mir" }
sparagmos-interp = { path = "../sparagmos-interp" }
sparagmos-jit = { path = "../sparagmos-jit" }

[[bin]]
name = "sparagmos-driver"
path = "src/main.rs"

# The profile the measurement workflows build the driver with: the dev
# profile's semantics (debug assertions and overflow checks stay on, so
# a check that panics under `cargo build` panics here too) with the
# optimizer on. Only how fast the driver runs differs, which is what
# the per-record timeouts see (docs/CI.md, "Hosted-runner calibration").
[profile.measure]
inherits = "dev"
opt-level = 3
debug = false
incremental = false

[[test]]
name = "driver_run"
path = "tests/driver_run/mod.rs"
