[package]
name = "sparagmos-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The interpreter runner drives the Stable MIR driver binary
# (sparagmos-driver) as a subprocess; the driver performs the MIR
# conversion and interpretation in its own process. The JIT runner
# uses the same driver for conversion, then reads the driver's dump
# back and executes it in-process with sparagmos-jit.
sparagmos-jit = { path = "../sparagmos-jit" }
sparagmos-mir = { path = "../sparagmos-mir" }
